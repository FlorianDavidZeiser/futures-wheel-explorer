<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e1a" />
    <meta name="color-scheme" content="dark" />

    <title>Aus der Zeit gefallen</title>
    <meta name="description" content="Eine kleine Reise. Drei Minuten." />

    <!-- Teilen als Link, Open Graph und Twitter. Das Vorschaubild verraet nichts.
         og:image muss absolut sein, sonst findet LinkedIn das Bild nicht. Die
         Adresse zeigt auf GitHub Pages des Repos aus-der-zeit-gefallen. Bei eigener
         Domain einfach die Basis-URL hier ersetzen und neu bauen. Kein og:url, damit
         LinkedIn beim Neu-Einlesen einen Cache-Bust per ?v= nicht zusammenfaltet. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aus der Zeit gefallen" />
    <meta property="og:description" content="Eine kleine Reise. Drei Minuten." />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:image" content="https://floriandavidzeiser.github.io/aus-der-zeit-gefallen/og-image.png" />
    <meta property="og:image:secure_url" content="https://floriandavidzeiser.github.io/aus-der-zeit-gefallen/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Aus der Zeit gefallen. Alles fließt." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aus der Zeit gefallen" />
    <meta name="twitter:description" content="Eine kleine Reise. Drei Minuten." />
    <meta name="twitter:image" content="https://floriandavidzeiser.github.io/aus-der-zeit-gefallen/og-image.png" />

    <!-- Favicon, eine kleine warme Flamme im Dunkeln, inline als Data-URI. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0e1a'/%3E%3Cellipse cx='16' cy='17' rx='9' ry='10' fill='%23ffcf87' opacity='0.22'/%3E%3Cpath d='M16 7c3 4 5 6 5 9a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3 0-5 1-7z' fill='%23ffcf87'/%3E%3C/svg%3E"
    />

    <!--
      Die Schriften Fraunces und Inter sind als Latin-Subset base64-inline in
      styles/fonts.css eingebettet. Die Einzeldatei braucht kein Netz, und es gibt
      robuste System-Fallbacks aus tailwind.config.js.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
