async function exportWheelPng(svgElement, bbox) {
  const padding = 100;
  const rootStyles = getComputedStyle(document.documentElement);
  const varNames = [
    '--c-ink', '--c-bg', '--c-bg-soft', '--c-muted', '--c-line',
    '--c-accent', '--c-accent-soft',
    '--c-ring-0', '--c-ring-1', '--c-ring-2', '--c-ring-3',
    '--c-ring-1-soft', '--c-ring-2-soft', '--c-ring-3-soft',
    '--c-ocher', '--c-ocher-soft',
    '--font-serif', '--font-sans',
  ];
  const varDecls = varNames
    .map((n) => n + ': ' + rootStyles.getPropertyValue(n).trim() + ';')
    .join(' ');

  const clone = svgElement.cloneNode(true);
  clone.querySelectorAll('.wheel-ctrl-btn, .wheel-controls').forEach((el) => el.remove());

  const w = (bbox.maxX - bbox.minX) + padding * 2;
  const h = (bbox.maxY - bbox.minY) + padding * 2;
  const vbX = bbox.minX - padding;
  const vbY = bbox.minY - padding;

  clone.setAttribute('viewBox', vbX + ' ' + vbY + ' ' + w + ' ' + h);
  clone.setAttribute('width', w);
  clone.setAttribute('height', h);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');

  const NS = 'http://www.w3.org/2000/svg';
  const styleEl = document.createElementNS(NS, 'style');
  styleEl.textContent = 'svg { ' + varDecls + ' } '
    + '.connection-line { fill: none; stroke-linecap: round; }'
    + '.node-circle { stroke-width: 2; }'
    + '* { animation: none !important; transition: none !important; }';
  clone.insertBefore(styleEl, clone.firstChild);

  const bgRect = document.createElementNS(NS, 'rect');
  bgRect.setAttribute('x', vbX);
  bgRect.setAttribute('y', vbY);
  bgRect.setAttribute('width', w);
  bgRect.setAttribute('height', h);
  bgRect.setAttribute('fill', rootStyles.getPropertyValue('--c-bg').trim());
  clone.insertBefore(bgRect, clone.firstChild.nextSibling);

  const xml = new XMLSerializer().serializeToString(clone);
  const svg64 = btoa(unescape(encodeURIComponent(xml)));
  const dataUrl = 'data:image/svg+xml;base64,' + svg64;

  const img = new Image();
  await new Promise((resolve, reject) => {
    img.onload = resolve;
    img.onerror = (e) => reject(new Error('SVG image load failed'));
    img.src = dataUrl;
  });

  const scale = 2;
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(w * scale);
  canvas.height = Math.round(h * scale);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = rootStyles.getPropertyValue('--c-bg').trim();
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

  const pngUrl = canvas.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = pngUrl;
  a.download = 'futures-wheel-' + new Date().toISOString().slice(0, 10) + '.png';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function computeWheelStats(state) {
  const total = state.nodes.filter((n) => n.ring > 0).length;
  const ring1 = state.nodes.filter((n) => n.ring === 1);
  const branchesDeepened = ring1.filter((n) =>
    state.nodes.some((c) => c.parentId === n.id),
  ).length;
  const noteCount = state.nodes.filter((n) => n.disruptorNote).length;
  return { total, branchesDeepened, noteCount };
}

function formatStats(stats) {
  const parts = [];
  parts.push(stats.total + ' ' + (stats.total === 1 ? 'Folge' : 'Folgen'));
  if (stats.branchesDeepened > 0) {
    parts.push(stats.branchesDeepened + ' ' + (stats.branchesDeepened === 1 ? 'Ast vertieft' : 'Aeste vertieft'));
  }
  if (stats.noteCount > 0) {
    parts.push(stats.noteCount + ' ' + (stats.noteCount === 1 ? 'notierte Stoerfrage' : 'notierte Stoerfragen'));
  }
  return parts.join('  ·  ');
}

function TextTrace({ state }) {
  const { React, htm } = window;
  const html = htm.bind(React.createElement);

  const center = getCenter(state);
  if (!center) return null;

  const renderNode = (node) => {
    const note = node.disruptorNote;
    const typeLabel = note ? (DISRUPTOR_TYPES[note.questionType]?.label || '') : '';
    return html`
      <div key=${node.id} class="trace-node" data-ring=${node.ring}>
        <div class="trace-node-text">${node.text}</div>
        ${note && html`
          <div class="trace-disruptor-note">
            <div class="trace-disruptor-meta">
              <span class="trace-disruptor-pill">${PROMPTS.result.disruptorLabel}</span>
              <span class="trace-disruptor-type">${typeLabel}</span>
            </div>
            <div class="trace-disruptor-q">${note.question}</div>
            <div class="trace-disruptor-a">${note.answer}</div>
          </div>
        `}
      </div>`;
  };

  const renderSubtree = (parent) => {
    const kids = getChildren(state, parent.id);
    return kids.map((child) => html`
      <${React.Fragment} key=${child.id}>
        ${renderNode(child)}
        ${renderSubtree(child)}
      </>
    `);
  };

  const notes = state.nodes.filter((n) => n.disruptorNote);

  const headline = state.isExample
    ? PROMPTS.result.exampleHeadline
    : PROMPTS.result.headline;
  const subline = state.isExample
    ? PROMPTS.result.exampleSubline
    : PROMPTS.result.subline;

  const stats = computeWheelStats(state);
  const statsLine = formatStats(stats);

  return html`
    <div class="result-trace">
      <div class="trace-head">
        ${state.isExample && html`<div class="example-badge">${PROMPTS.result.exampleBadge}</div>`}
        <h2 class="trace-headline">${headline}</h2>
        <div class="trace-stats">${statsLine}</div>
        <div class="trace-subline">${subline}</div>
      </div>

      <div class="trace-section">
        <div class="trace-section-label">${PROMPTS.result.centerLabel}</div>
        <div class="trace-center">${center.text}</div>
      </div>

      <div class="trace-section">
        <div class="trace-section-label">${PROMPTS.result.foldersLabel}</div>
        ${renderSubtree(center)}
      </div>

      ${notes.length > 0 && html`
        <div class="trace-section">
          <div class="trace-section-label">${PROMPTS.result.notesSummaryLabel}</div>
          <div class="notes-summary">
            ${notes.map((n) => {
              const t = DISRUPTOR_TYPES[n.disruptorNote.questionType]?.label || '';
              return html`
                <div key=${'sum_' + n.id} class="note-summary-card">
                  <div class="note-summary-pill">${t}</div>
                  <div class="note-summary-source">zu „${n.text}"</div>
                  <div class="note-summary-q">${n.disruptorNote.question}</div>
                  <div class="note-summary-a">${n.disruptorNote.answer}</div>
                </div>`;
            })}
          </div>
        </div>
      `}

      ${state.parkingLot && state.parkingLot.length > 0 && html`
        <div class="trace-section">
          <div class="trace-section-label">${PROMPTS.result.openThoughtsLabel}</div>
          <div class="open-thoughts-list">
            ${state.parkingLot.map((entry, i) => html`
              <div key=${'ot_' + i} class="open-thought">${entry}</div>
            `)}
          </div>
        </div>
      `}
    </div>`;
}

function ResultView({ state, dispatch }) {
  const { React, htm } = window;
  const { useRef, useState, useEffect } = React;
  const html = htm.bind(React.createElement);

  const wheelRef = useRef(null);

  const onWheelReady = (info) => {
    wheelRef.current = info;
  };

  // Reveal stages: 0 = wheel only, 1 = wheel + trace, 2 = wheel + trace + actions
  // Example mode skips the staged reveal (it's not a "finale" moment).
  const [revealStage, setRevealStage] = useState(state.isExample ? 2 : 0);
  useEffect(() => {
    if (state.isExample) return;
    const t1 = setTimeout(() => setRevealStage(1), 520);
    const t2 = setTimeout(() => setRevealStage(2), 880);
    return () => {
      clearTimeout(t1);
      clearTimeout(t2);
    };
  }, []);

  const [exporting, setExporting] = useState(false);
  const onExport = async () => {
    if (!wheelRef.current) return;
    setExporting(true);
    try {
      await exportWheelPng(wheelRef.current.svgRef.current, wheelRef.current.bbox);
    } catch (e) {
      console.error('Export fehlgeschlagen:', e);
      alert('Bild-Export fehlgeschlagen. Bitte erneut versuchen.');
    } finally {
      setExporting(false);
    }
  };

  const resultClass = 'result reveal-' + revealStage;

  return html`
    <div class=${resultClass}>
      <div class="result-main">
        <${WheelView}
          state=${state}
          dispatch=${dispatch}
          onWheelRefReady=${onWheelReady}
        />
        <div class="result-actions">
          ${!state.isExample && html`
            <button
              class="btn-primary"
              onClick=${onExport}
              disabled=${exporting}
            >${exporting ? 'Speichere...' : PROMPTS.result.exportPng}</button>
            <button
              class="btn-outline"
              onClick=${() => dispatch({ type: 'BACK_TO_BUILD' })}
            >${PROMPTS.result.backToBuild}</button>
            <button
              class="btn-ghost"
              onClick=${() => { if (confirm('Wirklich neu beginnen?')) dispatch({ type: 'RESTART' }); }}
            >${PROMPTS.result.restart}</button>
          `}
          ${state.isExample && html`
            <button
              class="btn-primary"
              onClick=${() => dispatch({ type: 'RESTART' })}
            >${PROMPTS.result.backFromExample}</button>
            <button
              class="btn-outline"
              onClick=${onExport}
              disabled=${exporting}
            >${exporting ? 'Speichere...' : PROMPTS.result.exportPng}</button>
          `}
        </div>
      </div>
      <${TextTrace} state=${state} />
    </div>`;
}


/* ===== src/app.js ===== */
function App() {
  const { React, htm } = window;
  const { useReducer, useRef } = React;
  const html = htm.bind(React.createElement);

  const [state, dispatch] = useReducer(wheelReducer, initialWheelState);
  const wheelRef = useRef(null);

  const onWheelReady = (info) => {
    wheelRef.current = info;
  };

  if (state.phase === 'intro') {
    return html`
      <div class="app">
        <header class="topbar">
          <div class="title">${PROMPTS.app.title}</div>
          <div class="subtitle">${PROMPTS.app.subtitle}</div>
        </header>
        <${IntroPanel} dispatch=${dispatch} initialText=${state.draftSeed || ''} />
      </div>`;
  }

  if (state.phase === 'confirm-seed') {
    return html`
      <div class="app">
        <header class="topbar">
          <div class="title">${PROMPTS.app.title}</div>
          <div class="subtitle">${PROMPTS.app.subtitle}</div>
        </header>
        <${ConfirmSeedPanel} state=${state} dispatch=${dispatch} />
      </div>`;
  }

  if (state.phase === 'build') {
    return html`
      <div class="app">
        <header class="topbar">
          <div class="title">${PROMPTS.app.title}</div>
          <div class="subtitle">
            ${state.seed.length > 60 ? state.seed.slice(0, 58) + '…' : state.seed}
          </div>
        </header>
        <div class="build">
          <${WheelView}
            state=${state}
            dispatch=${dispatch}
            onWheelRefReady=${onWheelReady}
          />
          <${FlowPanel} state=${state} dispatch=${dispatch} />
        </div>
      </div>`;
  }

  return html`
    <div class="app">
      <header class="topbar">
        <div class="title">${PROMPTS.result.headline}</div>
        <div class="subtitle">
          ${state.seed.length > 60 ? state.seed.slice(0, 58) + '…' : state.seed}
        </div>
      </header>
      <${ResultView} state=${state} dispatch=${dispatch} />
    </div>`;
}

(function bootstrap() {
  const { React, ReactDOM } = window;
  const root = ReactDOM.createRoot(document.getElementById('app'));
  root.render(React.createElement(App));
})();

  </script>
