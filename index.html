  --c-ring-2-soft: #B5C9B2;
  --c-ring-3-soft: #ACB6C2;

  --c-ocher: #C9A24B;
  --c-ocher-soft: #E3CB8B;

  --font-serif: Fraunces, "Source Serif Pro", Georgia, "Times New Roman", serif;
  --font-sans: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 16px;

  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 64px;

  --shadow-soft: 0 2px 12px rgba(31, 33, 35, 0.06);
  --shadow-lift: 0 6px 24px rgba(31, 33, 35, 0.10);
  --shadow-overlay: 0 20px 60px rgba(31, 33, 35, 0.25);

  --t-fast: 180ms;
  --t-med: 360ms;
  --t-slow: 600ms;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
}

* { box-sizing: border-box; }

html, body, #app {
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  background: var(--c-bg);
  color: var(--c-ink);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
}

button {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 0;
  margin: 0;
}

input, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  border: none;
  outline: none;
  background: transparent;
}

.app {
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100%;
  overflow: hidden;
}

.topbar {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: var(--s-3) var(--s-5);
  border-bottom: 1px solid var(--c-line);
  background: var(--c-bg);
  z-index: 5;
}

.topbar .title {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: 18px;
  letter-spacing: 0.01em;
}

.topbar .subtitle {
  font-size: 13px;
  color: var(--c-muted);
}

/* ===== INTRO ===== */

.intro {
  height: 100%;
  overflow-y: auto;
  padding: var(--s-6) var(--s-5);
  background: var(--c-bg);
}

.intro-inner {
  max-width: 640px;
  width: 100%;
  margin: 0 auto;
  text-align: center;
  padding-block: var(--s-5);
}

.intro-hero {
  text-align: center;
  padding-block: var(--s-7) var(--s-6);
  border-bottom: 1px solid var(--c-line);
  margin-bottom: var(--s-7);
}

.intro-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: clamp(36px, 5vw, 56px);
  line-height: 1.05;
  letter-spacing: -0.01em;
  margin: 0 0 var(--s-3);
  color: var(--c-ink);
}

.intro-subtitle {
  font-family: var(--font-serif);
  font-size: clamp(15px, 1.6vw, 18px);
  font-style: italic;
  color: var(--c-muted);
  margin: 0;
  line-height: 1.4;
}

.intro-question-block {
  margin-bottom: var(--s-5);
}

.intro-question {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: clamp(22px, 2.8vw, 30px);
  line-height: 1.2;
  margin: 0 0 var(--s-3);
  color: var(--c-ink);
}

.intro .lead {
  font-size: clamp(14px, 1.6vw, 16px);
  color: var(--c-muted);
  margin: 0 0 var(--s-4);
  line-height: 1.55;
}

.intro-input-wrap {
  margin-bottom: var(--s-6);
}

.intro-input {
  width: 100%;
  padding: var(--s-4) var(--s-5);
  border: 1px solid var(--c-line);
  border-radius: var(--r-md);
  background: #fff;
  font-size: 17px;
  font-family: var(--font-serif);
  text-align: center;
  transition: border-color var(--t-fast) var(--ease-out), box-shadow var(--t-fast) var(--ease-out);
}

.intro-input:focus {
  border-color: var(--c-accent);
  box-shadow: 0 0 0 3px rgba(44, 95, 124, 0.12);
}

.intro-hint {
  font-size: 13px;
  color: var(--c-muted);
  margin-top: var(--s-2);
}

.intro-guidance {
  font-family: var(--font-serif);
  font-size: 14px;
  font-style: italic;
  color: var(--c-muted);
  line-height: 1.55;
  margin-top: 0;
  padding: var(--s-3) var(--s-4);
  border-left: 2px solid var(--c-ocher-soft);
  text-align: left;
  background: rgba(201, 162, 75, 0.05);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
}

.intro-example {
  margin-top: var(--s-6);
  padding-top: var(--s-5);
  border-top: 1px dashed var(--c-line);
}

.howto-card {
  margin-top: var(--s-6);
  margin-bottom: var(--s-6);
  background: #fff;
  border: 1px solid var(--c-line);
  border-radius: var(--r-md);
  text-align: left;
  transition: border-color var(--t-fast) var(--ease-out);
}

.howto-card.open {
  border-color: var(--c-muted-soft);
}

.howto-toggle {
  width: 100%;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s-3);
  padding: var(--s-4) var(--s-5);
  text-align: left;
  cursor: pointer;
  transition: background var(--t-fast) var(--ease-out);
}

.howto-toggle:hover {
  background: rgba(0, 0, 0, 0.015);
}

.howto-toggle-title {
  font-family: var(--font-serif);
  font-size: 17px;
  font-weight: 400;
  color: var(--c-ink);
}

.howto-toggle-action {
  font-size: 12px;
  letter-spacing: 0.04em;
  color: var(--c-muted);
  text-transform: lowercase;
}

.howto-body {
  padding: 0 var(--s-5) var(--s-5);
  animation: fade-in var(--t-fast) var(--ease-out);
}

.howto-intro {
  font-size: 14.5px;
  line-height: 1.55;
  color: var(--c-ink);
  margin: 0 0 var(--s-4);
}

.howto-points {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: var(--s-3);
}

.howto-point {
  font-size: 14px;
  line-height: 1.55;
  color: var(--c-ink);
  padding-left: var(--s-4);
  border-left: 2px solid var(--c-line);
}

.howto-point:last-child {
  border-left-color: var(--c-ocher-soft);
}

.howto-lead {
  font-weight: 600;
  color: var(--c-ink);
}

.link-btn {
  color: var(--c-accent);
  font-size: 14px;
  padding: var(--s-2) var(--s-3);
  border-radius: var(--r-sm);
  transition: color var(--t-fast) var(--ease-out), background var(--t-fast) var(--ease-out);
}

.link-btn:hover {
  color: var(--c-accent-soft);
  background: var(--c-bg-soft);
}

.intro-seeds-label {
  font-size: 13px;
  color: var(--c-muted);
  margin-bottom: var(--s-3);
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

.intro-seeds {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: var(--s-3);
}

.seed-card {
  padding: var(--s-4);
  border: 1px solid var(--c-line);
  border-radius: var(--r-md);
  background: #fff;
  font-family: var(--font-serif);
  font-size: 15px;
  line-height: 1.35;
  color: var(--c-ink);
  text-align: left;
  transition: border-color var(--t-fast) var(--ease-out),
              transform var(--t-fast) var(--ease-out),
              box-shadow var(--t-fast) var(--ease-out);
}

.seed-card:hover {
  border-color: var(--c-accent-soft);
  transform: translateY(-1px);
  box-shadow: var(--shadow-soft);
}

.btn-primary {
  display: inline-block;
  padding: var(--s-3) var(--s-5);
  background: var(--c-accent);
  color: var(--c-bg);
  border-radius: var(--r-md);
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 0.01em;
  transition: background var(--t-fast) var(--ease-out),
              transform var(--t-fast) var(--ease-out);
}

.btn-primary:hover {
  background: var(--c-accent-soft);
}

.btn-primary:disabled {
  background: var(--c-muted-soft);
  cursor: not-allowed;
}

.btn-ghost {
  padding: var(--s-2) var(--s-4);
  color: var(--c-muted);
  font-size: 14px;
  border-radius: var(--r-md);
  transition: color var(--t-fast) var(--ease-out), background var(--t-fast) var(--ease-out);
}

.btn-ghost:hover {
  color: var(--c-ink);
  background: var(--c-bg-soft);
}

.btn-outline {
  padding: var(--s-3) var(--s-5);
  border: 1px solid var(--c-line);
  border-radius: var(--r-md);
  font-size: 14px;
  color: var(--c-ink);
  background: #fff;
  transition: border-color var(--t-fast) var(--ease-out);
}

.btn-outline:hover {
  border-color: var(--c-accent);
}

/* ===== CONFIRM-SEED ===== */

.confirm {
  height: 100%;
  overflow-y: auto;
  padding: var(--s-6) var(--s-5);
  background: var(--c-bg);
}

.confirm-inner {
  max-width: 680px;
  width: 100%;
  margin: 0 auto;
  padding-block: var(--s-5);
}

.confirm-eyebrow {
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--c-ocher);
  margin-bottom: var(--s-3);
  text-align: center;
}

.confirm-headline {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: clamp(24px, 3vw, 34px);
  line-height: 1.2;
  margin: 0 0 var(--s-4);
  text-align: center;
}

.confirm-lead {
  text-align: center;
  font-size: 15px;
  color: var(--c-muted);
  line-height: 1.55;
  margin: 0 auto var(--s-6);
  max-width: 540px;
}

.confirm-seed-input {
  width: 100%;
  padding: var(--s-4) var(--s-5);
  border: 1px solid var(--c-line);
  border-radius: var(--r-md);
  background: #fff;
  font-size: 18px;
  font-family: var(--font-serif);
  line-height: 1.35;
  resize: vertical;
  min-height: 60px;
  margin-bottom: var(--s-5);
  transition: border-color var(--t-fast) var(--ease-out);
}

.confirm-seed-input:focus {
  border-color: var(--c-accent);
  box-shadow: 0 0 0 3px rgba(44, 95, 124, 0.12);
}

.confirm-examples {
  background: var(--c-bg-soft);
  border-radius: var(--r-md);
  padding: var(--s-4) var(--s-5);
  margin-bottom: var(--s-6);
}

.confirm-examples-label {
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--c-muted);
  margin-bottom: var(--s-3);
}

.confirm-example {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: var(--s-3);
  align-items: baseline;
  padding: var(--s-2) 0;
  font-size: 14px;
  line-height: 1.4;
}

.confirm-example + .confirm-example {
  border-top: 1px dashed var(--c-line);
}

.confirm-example-from {
  color: var(--c-muted);
  font-family: var(--font-serif);
  font-style: italic;
}

.confirm-example-arrow {
  color: var(--c-muted-soft);
  font-size: 16px;
}

.confirm-example-to {
  color: var(--c-ink);
  font-family: var(--font-serif);
}

.confirm-actions {
  display: flex;
  gap: var(--s-3);
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
}

/* ===== BUILD ===== */

.build {
  display: grid;
  grid-template-columns: 1fr 360px;
  grid-template-rows: 1fr;
  height: 100%;
  overflow: hidden;
}

.wheel-stage {
  position: relative;
  background: var(--c-bg);
  overflow: hidden;
  min-height: 0;
}

.wheel-stage svg {
  width: 100%;
  height: 100%;
  display: block;
  cursor: grab;
}

.wheel-stage svg.dragging {
  cursor: grabbing;
}

.wheel-controls {
  position: absolute;
  top: var(--s-3);
  right: var(--s-3);
  display: flex;
  gap: var(--s-1);
  background: rgba(245, 241, 232, 0.85);
  backdrop-filter: blur(6px);
  border: 1px solid var(--c-line);
  border-radius: var(--r-md);
  padding: var(--s-1);
  z-index: 3;
}

.wheel-ctrl-btn {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--r-sm);
  font-size: 15px;
  color: var(--c-muted);
  transition: background var(--t-fast) var(--ease-out), color var(--t-fast) var(--ease-out);
}

.wheel-ctrl-btn:hover {
  background: var(--c-bg-soft);
  color: var(--c-ink);
}

.flow-panel {
  border-left: 1px solid var(--c-line);
  background: var(--c-bg-soft);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.flow-header {
  padding: var(--s-5) var(--s-5) var(--s-3);
  border-bottom: 1px solid var(--c-line);
  background: var(--c-bg-soft);
  position: sticky;
  top: 0;
  z-index: 3;
}

.flow-context {
  font-size: 12px;
  color: var(--c-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: var(--s-2);
}

.flow-deepening {
  font-family: var(--font-serif);
  font-size: 14px;
  font-style: italic;
  color: var(--c-muted);
  margin-bottom: var(--s-2);
}

.flow-deepening em {
  color: var(--c-ink);
  font-style: normal;
}

.flow-question {
  font-family: var(--font-serif);
  font-size: 21px;
  line-height: 1.3;
  font-weight: 400;
  color: var(--c-ink);
  margin: 0 0 var(--s-2);
}

.flow-hint {
  font-size: 13px;
  color: var(--c-muted);
  line-height: 1.45;
}

.flow-body {
  padding: var(--s-4) var(--s-5);
  flex: 1 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--s-3);
}

.flow-header .flow-input-row {
  margin-top: var(--s-3);
}

.flow-input-row {
  display: flex;
  gap: var(--s-2);
  align-items: stretch;
}

.flow-input {
  flex: 1;
  padding: var(--s-3) var(--s-4);
  border: 1px solid var(--c-line);
  border-radius: var(--r-md);
  background: #fff;
  font-size: 15px;
  transition: border-color var(--t-fast) var(--ease-out);
}

.flow-input:focus {
  border-color: var(--c-accent);
  box-shadow: 0 0 0 3px rgba(44, 95, 124, 0.10);
}

.flow-add-btn {
  padding: 0 var(--s-4);
  background: var(--c-accent);
  color: var(--c-bg);
  border-radius: var(--r-md);
  font-size: 14px;
  transition: background var(--t-fast) var(--ease-out);
}

.flow-add-btn:hover { background: var(--c-accent-soft); }
.flow-add-btn:disabled {
  background: var(--c-muted-soft);
  cursor: not-allowed;
}

.thinking-block {
  padding-top: var(--s-1);
}

.thinking-label {
  font-size: 12px;
  color: var(--c-muted);
  letter-spacing: 0.02em;
  margin-bottom: var(--s-2);
  font-style: italic;
  font-family: var(--font-serif);
}

.thinking-chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-1);
}

.thinking-chip {
  font-size: 12.5px;
  padding: 6px 12px;
  background: #fff;
  border: 1px solid var(--c-line);
  border-radius: 999px;
  color: var(--c-muted);
  transition: color var(--t-fast) var(--ease-out),
              border-color var(--t-fast) var(--ease-out),
              background var(--t-fast) var(--ease-out);
}

.thinking-chip:hover {
  color: var(--c-ink);
  border-color: var(--c-muted-soft);
}

.thinking-chip.active {
  color: var(--c-bg);
  background: var(--c-muted);
  border-color: var(--c-muted);
}

.thinking-question {
  margin-top: var(--s-3);
  padding: var(--s-3) var(--s-4);
  background: rgba(140, 136, 129, 0.08);
  border-left: 2px solid var(--c-muted);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 14px;
  line-height: 1.5;
  color: var(--c-ink);
  animation: fade-in var(--t-fast) var(--ease-out);
}

.flow-existing-list {
  display: flex;
  flex-direction: column;
  gap: var(--s-2);
}

.flow-existing-item {
  font-size: 14px;
  padding: var(--s-2) var(--s-3);
  border-radius: var(--r-sm);
  background: #fff;
  border: 1px solid var(--c-line);
  display: flex;
  align-items: flex-start;
  gap: var(--s-2);
}

.flow-existing-item .marker {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 7px;
}

.flow-footer {
  padding: var(--s-4) var(--s-5);
  border-top: 1px solid var(--c-line);
  display: flex;
  gap: var(--s-2);
  flex-direction: column;
  background: var(--c-bg-soft);
  position: sticky;
  bottom: 0;
  z-index: 3;
  flex-shrink: 0;
}

.flow-footer .row {
  display: flex;
  gap: var(--s-2);
  justify-content: space-between;
  align-items: center;
}

.finish-cta {
  font-size: 14px;
  padding: var(--s-3) var(--s-4);
  border-radius: var(--r-md);
  background: transparent;
  color: var(--c-muted);
  border: 1px solid var(--c-line);
  transition: color var(--t-fast) var(--ease-out),
              border-color var(--t-fast) var(--ease-out),
              background var(--t-fast) var(--ease-out);
}

.finish-cta.subtle {
  opacity: 0.85;
}

.finish-cta.prominent {
  background: var(--c-accent);
  color: var(--c-bg);
  border-color: var(--c-accent);
  font-weight: 500;
}

.finish-cta.prominent:hover {
  background: var(--c-accent-soft);
  border-color: var(--c-accent-soft);
}

.flow-meta-hint {
  font-size: 12px;
  color: var(--c-muted);
  line-height: 1.4;
  font-style: italic;
  font-family: var(--font-serif);
}

/* ===== PARKING LOT ===== */

.parking-lot {
  border-top: 1px solid var(--c-line);
  background: var(--c-bg-soft);
  flex-shrink: 0;
}

.parking-header {
  width: 100%;
  display: flex;
  align-items: center;
  gap: var(--s-2);
  padding: var(--s-3) var(--s-5);
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--c-muted);
  transition: color var(--t-fast) var(--ease-out), background var(--t-fast) var(--ease-out);
  text-align: left;
  cursor: pointer;
}

.parking-header:hover {
  color: var(--c-ink);
  background: rgba(0, 0, 0, 0.02);
}

.parking-title {
  font-weight: 500;
}

.parking-count {
  background: var(--c-muted);
  color: var(--c-bg);
  font-size: 10px;
  padding: 1px 8px;
  border-radius: 999px;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.parking-toggle {
  margin-left: auto;
  font-size: 12px;
  color: var(--c-muted-soft);
}

.parking-body {
  padding: 0 var(--s-5) var(--s-4);
  display: flex;
  flex-direction: column;
  gap: var(--s-2);
}

.parking-input-row {
  display: flex;
  gap: var(--s-1);
}

.parking-input {
  flex: 1;
  padding: var(--s-2) var(--s-3);
  border: 1px solid var(--c-line);
  border-radius: var(--r-sm);
  background: #fff;
  font-size: 13px;
  transition: border-color var(--t-fast) var(--ease-out);
}

.parking-input:focus {
  border-color: var(--c-muted);
}

.parking-add-btn {
  padding: 0 var(--s-3);
  background: var(--c-muted);
  color: var(--c-bg);
  border-radius: var(--r-sm);
  font-size: 12px;
  letter-spacing: 0.02em;
  transition: background var(--t-fast) var(--ease-out);
}

.parking-add-btn:hover { background: var(--c-ink); }
.parking-add-btn:disabled { background: var(--c-muted-soft); cursor: not-allowed; }

.parking-empty {
  font-size: 12px;
  color: var(--c-muted);
  font-style: italic;
  font-family: var(--font-serif);
  padding: var(--s-1) 0;
}

.parking-list {
  display: flex;
  flex-direction: column;
  gap: var(--s-1);
}

.parking-item {
  display: flex;
  align-items: flex-start;
  gap: var(--s-2);
  padding: var(--s-2) var(--s-3);
  background: #fff;
  border: 1px solid var(--c-line);
  border-radius: var(--r-sm);
  font-size: 13px;
  line-height: 1.4;
}

.parking-item-text {
  flex: 1;
  color: var(--c-ink);
  word-break: break-word;
}

.parking-item-actions {
  display: flex;
  gap: 2px;
  flex-shrink: 0;
}

.parking-promote-btn, .parking-remove-btn {
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
  font-size: 14px;
  color: var(--c-muted);
  line-height: 1;
  transition: background var(--t-fast) var(--ease-out), color var(--t-fast) var(--ease-out);
}

.parking-promote-btn:hover {
  background: rgba(44, 95, 124, 0.08);
  color: var(--c-accent);
}

.parking-remove-btn:hover {
  background: rgba(0, 0, 0, 0.05);
  color: var(--c-ink);
}

.parking-meta {
  font-size: 11.5px;
  color: var(--c-muted);
  font-style: italic;
  font-family: var(--font-serif);
  padding-top: var(--s-1);
}

/* Open thoughts in result */
.open-thoughts-list {
  display: flex;
  flex-direction: column;
  gap: var(--s-2);
}

.open-thought {
  padding: var(--s-2) var(--s-4);
  background: #fff;
  border-left: 3px solid var(--c-muted-soft);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: 13.5px;
  color: var(--c-ink);
  font-style: italic;
  font-family: var(--font-serif);
}

/* ===== DISRUPTOR — Invitation (not modal) ===== */

.disruptor-card-invite {
  position: absolute;
  top: var(--s-5);
  right: var(--s-5);
  width: clamp(280px, 36%, 420px);
  background: var(--c-bg);
  border: 1px solid var(--c-ocher-soft);
  border-left: 3px solid var(--c-ocher);
  border-radius: var(--r-md);
  padding: var(--s-4) var(--s-5);
  box-shadow: var(--shadow-lift);
  z-index: 12;
  animation: disruptor-slide-in 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
}

@keyframes disruptor-slide-in {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes disruptor-slide-up {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Mobile: disruptor becomes a viewport-wide bottom-sheet that overlays the flow panel,
   so the wheel stays fully visible above it */
@media (max-width: 860px) {
  .disruptor-card-invite {
    position: fixed;
    top: auto;
    right: 0;
    left: 0;
    bottom: 0;
    width: 100%;
    max-width: 100%;
    border-left: none;
    border-top: 3px solid var(--c-ocher);
    border-radius: var(--r-md) var(--r-md) 0 0;
    padding: var(--s-3) var(--s-4);
    box-shadow: 0 -8px 24px rgba(31, 33, 35, 0.12);
    animation: disruptor-slide-up 360ms cubic-bezier(0.22, 1, 0.36, 1) both;
    z-index: 30;
  }
  .disruptor-card-invite .disruptor-label {
    margin-bottom: var(--s-1);
    font-size: 11px;
  }
  .disruptor-card-invite .disruptor-question {
    font-size: 16px;
    margin: 0 0 var(--s-2);
    line-height: 1.3;
  }
  .disruptor-card-invite .disruptor-textarea {
    min-height: 48px;
    font-size: 16px; /* prevent iOS zoom-on-focus */
  }
  .disruptor-card-invite .disruptor-actions {
    flex-wrap: wrap;
    margin-top: var(--s-2);
  }
  .disruptor-card-invite .btn-soft {
    min-height: 36px;
    padding: var(--s-1) var(--s-3);
    flex: 1;
    min-width: 0;
    font-size: 12.5px;
  }
  .disruptor-card-invite .disruptor-hint {
    display: none;
  }
}

/* Kept for backward compat in case .disruptor-card class is referenced */
.disruptor-card {
  background: var(--c-bg);
  border-radius: var(--r-lg);
  border: 1px solid var(--c-line);
  box-shadow: var(--shadow-overlay);
  padding: var(--s-6);
  max-width: 560px;
  width: 100%;
}

.disruptor-label {
  font-size: 12px;
  color: var(--c-ocher);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: var(--s-3);
  font-weight: 600;
}

.disruptor-label .type-name {
  color: var(--c-muted);
  font-weight: 400;
  margin-left: var(--s-2);
}

.disruptor-question {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 18px;
  line-height: 1.32;
  font-weight: 400;
  color: var(--c-ink);
  margin: 0 0 var(--s-3);
}

.disruptor-textarea {
  width: 100%;
  min-height: 64px;
  padding: var(--s-2) var(--s-3);
  border: 1px solid var(--c-line);
  border-radius: var(--r-md);
  background: #fff;
  font-size: 13.5px;
  resize: vertical;
  font-family: var(--font-sans);
  transition: border-color var(--t-fast) var(--ease-out);
}

.disruptor-textarea:focus {
  border-color: var(--c-ocher);
  box-shadow: 0 0 0 3px rgba(201, 162, 75, 0.18);
}

.disruptor-actions {
  display: flex;
  gap: var(--s-2);
  justify-content: flex-end;
  margin-top: var(--s-3);
  align-items: center;
}

.disruptor-hint {
  font-size: 12px;
  color: var(--c-muted);
  font-style: italic;
  font-family: var(--font-serif);
  margin-top: var(--s-2);
  text-align: right;
}

/* Equal-weight soft buttons for the invitation card */
.btn-soft {
  padding: var(--s-2) var(--s-4);
  background: transparent;
  border: 1px solid var(--c-line);
  border-radius: var(--r-md);
  font-size: 13px;
  color: var(--c-muted);
  transition: background var(--t-fast) var(--ease-out),
              color var(--t-fast) var(--ease-out),
              border-color var(--t-fast) var(--ease-out);
}

.btn-soft:hover {
  color: var(--c-ink);
  border-color: var(--c-muted);
  background: rgba(0, 0, 0, 0.025);
}

.btn-soft.primary {
  border-color: var(--c-ocher);
  color: var(--c-ocher);
}

.btn-soft.primary:hover {
  background: rgba(201, 162, 75, 0.08);
  color: var(--c-ink);
  border-color: var(--c-ocher);
}

.btn-soft:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.btn-soft:disabled:hover {
  background: transparent;
  color: var(--c-muted);
  border-color: var(--c-line);
}

/* ===== RESULT ===== */

.result {
  display: grid;
  grid-template-columns: 1fr 420px;
  grid-template-rows: 1fr;
  height: 100%;
  overflow: hidden;
}

/* Staged reveal on entering result phase: wheel first (compose), then trace, then actions */
.result.reveal-0 .result-trace,
.result.reveal-0 .result-actions {
  opacity: 0;
  pointer-events: none;
}
.result.reveal-1 .result-trace {
  animation: trace-reveal 540ms cubic-bezier(0.22, 1, 0.36, 1) both;
}
.result.reveal-1 .result-actions {
  opacity: 0;
  pointer-events: none;
}
.result.reveal-2 .result-trace {
  animation: trace-reveal 540ms cubic-bezier(0.22, 1, 0.36, 1) both;
}
.result.reveal-2 .result-actions {
  animation: actions-reveal 380ms cubic-bezier(0.22, 1, 0.36, 1) both;
}

@keyframes trace-reveal {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes actions-reveal {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.result-main {
  display: grid;
  grid-template-rows: 1fr auto;
  min-height: 0;
  overflow: hidden;
}

.result-trace {
  border-left: 1px solid var(--c-line);
  background: var(--c-bg-soft);
  overflow-y: auto;
  padding: var(--s-6) var(--s-5);
}

.trace-head {
  margin-bottom: var(--s-6);
}

.example-badge {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--c-bg);
  background: var(--c-ocher);
  padding: 3px 10px;
  border-radius: 999px;
  margin-bottom: var(--s-3);
  font-weight: 600;
}

.trace-headline {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 26px;
  line-height: 1.2;
  margin: 0 0 var(--s-2);
}

.trace-stats {
  font-size: 12px;
  color: var(--c-ocher);
  letter-spacing: 0.04em;
  margin-bottom: var(--s-2);
  font-family: var(--font-sans);
  font-weight: 500;
}

.trace-subline {
  font-size: 13.5px;
  color: var(--c-muted);
  line-height: 1.5;
}

.trace-section {
  margin-bottom: var(--s-6);
}

.trace-section-label {
  font-size: 11.5px;
  color: var(--c-muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: var(--s-3);
  font-weight: 500;
}

.trace-center {
  font-family: var(--font-serif);
  font-size: 19px;
  line-height: 1.3;
  padding: var(--s-4) var(--s-5);
  border-left: 3px solid var(--c-ring-0);
  background: #fff;
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  box-shadow: var(--shadow-soft);
}

.trace-node {
  padding: var(--s-3) var(--s-4);
  background: #fff;
  border-radius: var(--r-sm);
  font-size: 14px;
  line-height: 1.45;
  margin-bottom: var(--s-2);
  border-left: 3px solid var(--c-line);
}

.trace-node[data-ring="1"] { border-left-color: var(--c-ring-1); }
.trace-node[data-ring="2"] { border-left-color: var(--c-ring-2); margin-left: var(--s-4); background: #fefdfa; }
.trace-node[data-ring="3"] { border-left-color: var(--c-ring-3); margin-left: var(--s-7); background: #fdfcf8; }

.trace-node-text { color: var(--c-ink); }

.trace-disruptor-note {
  margin-top: var(--s-3);
  padding: var(--s-3);
  background: rgba(201, 162, 75, 0.07);
  border-radius: var(--r-sm);
  border-left: 2px solid var(--c-ocher);
}

.trace-disruptor-meta {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  margin-bottom: var(--s-2);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.trace-disruptor-pill {
  background: var(--c-ocher);
  color: var(--c-bg);
  padding: 2px 8px;
  border-radius: 999px;
  font-weight: 600;
}

.trace-disruptor-type {
  color: var(--c-muted);
}

.trace-disruptor-q {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 13.5px;
  color: var(--c-ink);
  line-height: 1.4;
  margin-bottom: var(--s-1);
}

.trace-disruptor-a {
  font-size: 13.5px;
  color: var(--c-ink);
  line-height: 1.5;
}

.notes-summary {
  display: flex;
  flex-direction: column;
  gap: var(--s-3);
}

.note-summary-card {
  background: #fff;
  border: 1px solid var(--c-ocher-soft);
  border-radius: var(--r-md);
  padding: var(--s-3) var(--s-4);
}

.note-summary-pill {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--c-bg);
  background: var(--c-ocher);
  padding: 2px 10px;
  border-radius: 999px;
  margin-bottom: var(--s-2);
  font-weight: 600;
}

.note-summary-source {
  font-size: 12px;
  color: var(--c-muted);
  margin-bottom: var(--s-2);
  font-style: italic;
  font-family: var(--font-serif);
}

.note-summary-q {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 14px;
  color: var(--c-ink);
  line-height: 1.4;
  margin-bottom: var(--s-2);
}

.note-summary-a {
  font-size: 14px;
  color: var(--c-ink);
  line-height: 1.5;
}

.result-actions {
  display: flex;
  gap: var(--s-2);
  padding: var(--s-4) var(--s-5);
  border-top: 1px solid var(--c-line);
  background: var(--c-bg);
  flex-wrap: wrap;
  align-items: center;
  z-index: 5;
}

/* ===== WHEEL SVG ===== */

.node-group {
  cursor: pointer;
  transition: transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
  transform-box: fill-box;
  transform-origin: center;
}

.node-group .node-circle {
  transition: stroke-width var(--t-fast) var(--ease-out),
              filter var(--t-fast) var(--ease-out);
}
.node-group:hover .node-circle {
  stroke-width: 2.5;
  filter: brightness(1.02);
}
.node-group.active .node-circle {
  stroke-width: 3;
  filter: drop-shadow(0 2px 8px rgba(44, 95, 124, 0.25));
}

.node-text {
  font-family: var(--font-sans);
  pointer-events: none;
  user-select: none;
  fill: var(--c-ink);
}

.node-text.center {
  font-family: var(--font-serif);
  fill: #fff;
}

.disruptor-marker {
  fill: var(--c-ocher);
  pointer-events: none;
}

.connection-line {
  fill: none;
  stroke-linecap: round;
  transition: d 420ms cubic-bezier(0.22, 1, 0.36, 1);
}

/* Node action buttons (delete + edit) */
.node-action {
  opacity: 0;
  pointer-events: none;
  transition: opacity 180ms ease-out;
}
.node-group:hover .node-action,
.node-group.active .node-action {
  opacity: 1;
  pointer-events: auto;
}
.node-action-bg {
  fill: #fff;
  stroke: var(--c-muted-soft);
  stroke-width: 1;
  transition: fill 150ms ease-out, stroke 150ms ease-out;
}
.node-action-icon {
  fill: var(--c-muted);
  font-size: 17px;
  font-family: var(--font-sans);
  pointer-events: none;
  user-select: none;
  font-weight: 500;
}

/* On touch devices: action buttons always visible (no hover state) */
@media (hover: none) and (pointer: coarse) {
  .node-action {
    opacity: 0.85;
    pointer-events: auto;
  }
  .node-group .node-action {
    opacity: 0.85;
    pointer-events: auto;
  }
  .node-action-bg {
    stroke-width: 1.5;
  }
}
.node-action.delete-btn:hover .node-action-bg {
  fill: #fbecec;
  stroke: #b85c5c;
}
.node-action.delete-btn:hover .node-action-icon {
  fill: #b85c5c;
}
.node-action.edit-btn:hover .node-action-bg {
  fill: #eef4f9;
  stroke: var(--c-accent);
}
.node-action.edit-btn:hover .node-action-icon {
  fill: var(--c-accent);
}

/* Deepen hint */
.deepen-hint {
  position: absolute;
  top: var(--s-3);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: var(--s-2);
  padding: var(--s-2) var(--s-4);
  background: var(--c-ink);
  color: var(--c-bg);
  border-radius: 999px;
  font-size: 13px;
  font-family: var(--font-serif);
  font-style: italic;
  box-shadow: var(--shadow-lift);
  z-index: 4;
  pointer-events: none;
  animation: hint-appear 360ms cubic-bezier(0.22, 1, 0.36, 1) both;
}
.deepen-hint-arrow {
  display: inline-block;
  font-size: 14px;
  animation: hint-bounce 1.6s ease-in-out infinite;
}

@keyframes hint-appear {
  from { opacity: 0; transform: translateX(-50%) translateY(-8px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
@keyframes hint-bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* Edit overlay */
.edit-overlay {
  position: absolute;
  inset: 0;
  background: rgba(31, 33, 35, 0.32);
  backdrop-filter: blur(2px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--s-5);
  z-index: 15;
  animation: disruptor-fade-in 220ms var(--ease-out);
}
.edit-card {
  background: var(--c-bg);
  border: 1px solid var(--c-line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-overlay);
  padding: var(--s-5);
  max-width: 480px;
  width: 100%;
  animation: disruptor-rise 220ms var(--ease-out);
}
.edit-label {
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--c-muted);
  margin-bottom: var(--s-3);
  font-weight: 500;
}
.edit-textarea {
  width: 100%;
  padding: var(--s-3) var(--s-4);
  border: 1px solid var(--c-line);
  border-radius: var(--r-md);
  background: #fff;
  font-size: 15px;
  font-family: var(--font-sans);
  line-height: 1.4;
  resize: vertical;
  transition: border-color var(--t-fast) var(--ease-out);
}
.edit-textarea:focus {
  border-color: var(--c-accent);
  box-shadow: 0 0 0 3px rgba(44, 95, 124, 0.12);
}
.edit-actions {
  display: flex;
  gap: var(--s-2);
  justify-content: flex-end;
  margin-top: var(--s-3);
}

/* Mobile: anchor edit overlay near the top so the on-screen keyboard
   doesn't push the textarea out of view */
@media (max-width: 860px) {
  .edit-overlay {
    align-items: flex-start;
    padding-top: var(--s-5);
    padding-left: var(--s-3);
    padding-right: var(--s-3);
  }
  .edit-card {
    max-width: 100%;
    padding: var(--s-4);
  }
  .edit-textarea {
    min-height: 80px;
    font-size: 16px; /* prevent iOS zoom-on-focus */
  }
  .edit-actions {
    flex-wrap: wrap;
  }
  .edit-actions .btn-primary,
  .edit-actions .btn-ghost {
    min-height: 40px;
    min-width: 100px;
  }
}

/* ===== ANIMATIONS ===== */

@keyframes node-enter {
  0% { transform: scale(0.35); opacity: 0; }
  40% { opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes line-draw {
  from { stroke-dashoffset: var(--len, 1000); }
  to { stroke-dashoffset: 0; }
}

@keyframes disruptor-fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes disruptor-rise {
  from { opacity: 0; transform: translateY(12px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* Entering animation for newly added nodes only.
   Choreographie: line draws first (0-560ms), bubble appears alongside (starts ~120ms),
   text fades in shortly after, marker and actions appear last. */
.node-group.entering {
  transition: none;
}
.node-group.entering .node-circle {
  transform-box: fill-box;
  transform-origin: center;
  animation: node-enter 440ms 120ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
.node-group.entering foreignObject {
  animation: fade-in 320ms 240ms var(--ease-out) both;
}
.node-group.entering .disruptor-marker {
  animation: fade-in 320ms 500ms var(--ease-out) both;
}
.node-group.entering .node-action {
  animation: fade-in 280ms 600ms var(--ease-out) both;
}

.connection-line {
  stroke-dasharray: var(--len, 1000);
  stroke-dashoffset: 0;
}
.connection-line.entering {
  animation: line-draw 560ms cubic-bezier(0.22, 1, 0.36, 1) both;
}

/* Pulse animation: parent bubble "sends out" a thought */
@keyframes parent-pulse {
  0% { transform: scale(1); }
  35% { transform: scale(1.045); }
  100% { transform: scale(1); }
}
.node-group.pulsing .node-circle {
  transform-box: fill-box;
  transform-origin: center;
  animation: parent-pulse 320ms cubic-bezier(0.22, 1, 0.36, 1) both;
}

/* ===== MOBILE (Stufe 1) ===== */

@media (max-width: 860px) {
  .build {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr auto;
  }

  .flow-panel {
    border-left: none;
    border-top: 1px solid var(--c-line);
    max-height: 50vh;
  }

  .flow-header {
    padding: var(--s-3) var(--s-4);
  }

  .flow-question {
    font-size: 17px;
  }

  .flow-body {
    padding: var(--s-3) var(--s-4);
  }

  .flow-footer {
    padding: var(--s-3) var(--s-4);
  }

  .result {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr auto;
  }

  .result-trace {
    border-left: none;
    border-top: 1px solid var(--c-line);
    max-height: 45vh;
  }

  .topbar {
    padding: var(--s-2) var(--s-4);
  }

  .topbar .subtitle {
    display: none;
  }

  .disruptor-card {
    padding: var(--s-5) var(--s-4);
  }

  /* 16px input fonts prevent iOS Safari from auto-zooming on focus */
  .flow-input,
  .parking-input,
  .intro-input {
    font-size: 16px;
  }
  .flow-add-btn {
    min-height: 40px;
  }
  /* Slightly bigger seed cards for thumb-friendly taps */
  .seed-card {
    padding: var(--s-4) var(--s-5);
  }
}

@media (max-width: 480px) {
  .intro {
    padding: var(--s-4);
  }
  .intro-seeds {
    grid-template-columns: 1fr;
  }
  .confirm {
    padding: var(--s-4);
  }
  .confirm-example {
    grid-template-columns: 1fr;
    gap: var(--s-1);
  }
  .confirm-example-arrow {
    display: none;
  }
  .confirm-example-from::after {
    content: " →";
    color: var(--c-muted-soft);
  }
}

/* ===== REDUCED MOTION ===== */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 80ms !important;
  }
  .node-group.entering .node-circle,
  .node-group.entering foreignObject,
  .node-group.entering .disruptor-marker,
  .node-group.entering .node-action {
    animation: fade-in 180ms ease-out both !important;
  }
  .connection-line.entering {
    animation: fade-in 180ms ease-out both !important;
  }
  .deepen-hint-arrow {
    animation: none !important;
  }
}

const DISRUPTOR_TYPES = {

    ],

function pickDisruptorQuestion(type, history) {
  const candidates = DISRUPTOR_TYPES[type].questions;
  const used = new Set(
    history.filter((h) => h.questionType === type).map((h) => h.question),
  );
  const unused = candidates.filter((q) => !used.has(q));
  const pool = unused.length > 0 ? unused : candidates;
  return pool[Math.floor(Math.random() * pool.length)];
}

function nextDisruptorType(history, ringTransition) {
  const usedTypes = new Set(history.map((h) => h.questionType));
  if (ringTransition === '1to2' || ringTransition === '2to3') {
    const candidates = [1, 2, 3].filter((t) => !usedTypes.has(t));
    const pool = candidates.length > 0 ? candidates : [1, 2, 3];
    return pool[Math.floor(Math.random() * pool.length)];
  }
  return null;
}

/* ===== src/state/wheelReducer.js ===== */
let __nodeIdCounter = 0;
function __newNodeId() {
  __nodeIdCounter += 1;
  return 'n' + __nodeIdCounter + '_' + Date.now().toString(36);
}

const initialWheelState = {
  seed: '',
  draftSeed: '',
  nodes: [],
  phase: 'intro',
  activeParentId: null,
  disruptorHistory: [],
  contradictionPromptShown: false,
  pendingDisruptor: null,
  startedAt: null,
  isExample: false,
  parkingLot: [],
};

function getNode(state, id) {
  return state.nodes.find((n) => n.id === id) || null;
}

function getChildren(state, parentId) {
  return state.nodes.filter((n) => n.parentId === parentId);
}

function getCenter(state) {
  return state.nodes.find((n) => n.ring === 0) || null;
}

function getActiveRing(state) {
  if (!state.activeParentId) return 1;
  const parent = getNode(state, state.activeParentId);
  if (!parent) return 1;
  return parent.ring + 1;
}

function canFinish(state) {
  const center = getCenter(state);
  if (!center) return false;
  const ring1 = getChildren(state, center.id);
  if (ring1.length < 2) return false;
  const hasRing2 = ring1.some((n) => getChildren(state, n.id).length > 0);
  return hasRing2;
}

function shouldHighlightFinish(state) {
  return state.nodes.some((n) => n.ring === 3);
}

function branchCount(state) {
  const center = getCenter(state);
  if (!center) return 0;
  return getChildren(state, center.id).filter(
    (n) => getChildren(state, n.id).length > 0,
  ).length;
}

function maxChildrenForRing(ring) {
  return ring === 1 ? 4 : 3;
}

function wheelReducer(state, action) {
  switch (action.type) {
    case 'SET_SEED': {
      const seed = action.seed.trim();
      if (!seed) return state;
      if (action.fromSeedList) {
        const centerId = __newNodeId();
        return {
          ...state,
          seed,
          draftSeed: '',
          nodes: [{ id: centerId, text: seed, ring: 0, parentId: null }],
          phase: 'build',
          activeParentId: centerId,
          startedAt: new Date().toISOString(),
          isExample: false,
        };
      }
      return {
        ...state,
        draftSeed: seed,
        phase: 'confirm-seed',
      };
    }

    case 'CONFIRM_SEED': {
      const seed = (action.seed || state.draftSeed || '').trim();
      if (!seed) return state;
      const centerId = __newNodeId();
      return {
        ...state,
        seed,
        draftSeed: '',
        nodes: [{ id: centerId, text: seed, ring: 0, parentId: null }],
        phase: 'build',
        activeParentId: centerId,
        startedAt: new Date().toISOString(),
        isExample: false,
      };
    }

    case 'EDIT_SEED': {
      return {
        ...state,
        phase: 'intro',
      };
    }

    case 'LOAD_EXAMPLE': {
      return {
        ...initialWheelState,
        seed: EXAMPLE_WHEEL.seed,
        nodes: EXAMPLE_WHEEL.nodes.map((n) => ({ ...n })),
        phase: 'result',
        activeParentId: 'ex_c',
        disruptorHistory: EXAMPLE_WHEEL.disruptorHistory.map((h) => ({ ...h })),
        contradictionPromptShown: true,
        startedAt: new Date().toISOString(),
        isExample: true,
      };
    }

    case 'ADD_NODE': {
      const parentId = action.parentId || state.activeParentId;
      if (!parentId) return state;
      const parent = getNode(state, parentId);
      if (!parent) return state;
      const ring = parent.ring + 1;
      if (ring > 3) return state;
      const siblings = getChildren(state, parentId);
      if (siblings.length >= maxChildrenForRing(ring)) return state;
      const text = action.text.trim();
      if (!text) return state;
      const newNode = {
        id: __newNodeId(),
        text,
        ring,
        parentId,
      };

      const ring2ExistsBefore = state.nodes.some((n) => n.ring === 2);
      const ring3ExistsBefore = state.nodes.some((n) => n.ring === 3);
      const isFirstRing2 =
        ring === 2 &&
        !ring2ExistsBefore &&
        !state.disruptorHistory.find((h) => h.context === '1to2');
      const isFirstRing3 =
        ring === 3 &&
        !ring3ExistsBefore &&
        !state.disruptorHistory.find((h) => h.context === '2to3');

      let pendingDisruptor = state.pendingDisruptor;
      if (isFirstRing2) {
        const type = nextDisruptorType(state.disruptorHistory, '1to2');
        if (type) {
          pendingDisruptor = {
            nodeId: newNode.id,
            questionType: type,
            question: pickDisruptorQuestion(type, state.disruptorHistory),
            context: '1to2',
          };
        }
      } else if (isFirstRing3) {
        const type = nextDisruptorType(state.disruptorHistory, '2to3');
        if (type) {
          pendingDisruptor = {
            nodeId: newNode.id,
            questionType: type,
            question: pickDisruptorQuestion(type, state.disruptorHistory),
            context: '2to3',
          };
        }
      } else if (
        !state.contradictionPromptShown &&
        !state.pendingDisruptor &&
        ring >= 2
      ) {
        const projectedState = { ...state, nodes: [...state.nodes, newNode] };
        const projectedBranches = branchCount(projectedState);
        const projectedRing2 = projectedState.nodes.filter((n) => n.ring === 2).length;
        if (projectedBranches >= 2 && projectedRing2 >= 3) {
          pendingDisruptor = {
            nodeId: newNode.id,
            questionType: 4,
            question: pickDisruptorQuestion(4, state.disruptorHistory),
            context: 'contradiction',
          };
        }
      }

      return {
        ...state,
        nodes: [...state.nodes, newNode],
        pendingDisruptor,
      };
    }

    case 'DELETE_NODE': {
      const id = action.id;
      const target = getNode(state, id);
      if (!target || target.ring === 0) return state;

      const toDelete = new Set([id]);
      let changed = true;
      while (changed) {
        changed = false;
        state.nodes.forEach((n) => {
          if (n.parentId && toDelete.has(n.parentId) && !toDelete.has(n.id)) {
            toDelete.add(n.id);
            changed = true;
          }
        });
      }

      const remainingNodes = state.nodes.filter((n) => !toDelete.has(n.id));
      const center = remainingNodes.find((n) => n.ring === 0);
      let newActive = state.activeParentId;
      if (toDelete.has(state.activeParentId)) {
        newActive = center ? center.id : null;
      }

      return {
        ...state,
        nodes: remainingNodes,
        disruptorHistory: state.disruptorHistory.filter((h) => !toDelete.has(h.nodeId)),
        activeParentId: newActive,
        pendingDisruptor: state.pendingDisruptor && toDelete.has(state.pendingDisruptor.nodeId) ? null : state.pendingDisruptor,
      };
    }

    case 'EDIT_NODE': {
      const text = (action.text || '').trim();
      if (!text) return state;
      const target = getNode(state, action.id);
      if (!target) return state;
      return {
        ...state,
        nodes: state.nodes.map((n) => (n.id === action.id ? { ...n, text } : n)),
        seed: target.ring === 0 ? text : state.seed,
      };
    }

    case 'SELECT_PARENT': {
      const target = getNode(state, action.id);
      if (!target) return state;
      if (target.ring >= 3) return state;
      return { ...state, activeParentId: action.id };
    }

    case 'BACK_TO_CENTER': {
      const center = getCenter(state);
      if (!center) return state;
      return { ...state, activeParentId: center.id };
    }

    case 'ANSWER_DISRUPTOR': {
      const { pendingDisruptor } = state;
      if (!pendingDisruptor) return state;
      const answerTrim = (action.answer || '').trim();
      const nodes = state.nodes.map((n) => {
        if (n.id !== pendingDisruptor.nodeId) return n;
        if (!answerTrim) return n;
        return {
          ...n,
          disruptorNote: {
            questionType: pendingDisruptor.questionType,
            question: pendingDisruptor.question,
            answer: answerTrim,
          },
        };
      });
      const historyEntry = {
        nodeId: pendingDisruptor.nodeId,
        questionType: pendingDisruptor.questionType,
        question: pendingDisruptor.question,
        context: pendingDisruptor.context,
        answered: !!answerTrim,
      };
      return {
        ...state,
        nodes,
        pendingDisruptor: null,
        disruptorHistory: [...state.disruptorHistory, historyEntry],
        contradictionPromptShown:
          state.contradictionPromptShown ||
          pendingDisruptor.context === 'contradiction',
      };
    }

    case 'DISMISS_DISRUPTOR': {
      const { pendingDisruptor } = state;
      if (!pendingDisruptor) return state;
      return {
        ...state,
        pendingDisruptor: null,
        disruptorHistory: [
          ...state.disruptorHistory,
          {
            nodeId: pendingDisruptor.nodeId,
            questionType: pendingDisruptor.questionType,
            question: pendingDisruptor.question,
            context: pendingDisruptor.context,
            answered: false,
          },
        ],
        contradictionPromptShown:
          state.contradictionPromptShown ||
          pendingDisruptor.context === 'contradiction',
      };
    }

    case 'PARK_THOUGHT': {
      const text = (action.text || '').trim();
      if (!text) return state;
      if (state.parkingLot.includes(text)) return state;
      return { ...state, parkingLot: [...state.parkingLot, text] };
    }

    case 'UNPARK_THOUGHT': {
      const idx = action.index;
      if (idx == null || idx < 0 || idx >= state.parkingLot.length) return state;
      return {
        ...state,
        parkingLot: state.parkingLot.filter((_, i) => i !== idx),
      };
    }

    case 'PROMOTE_THOUGHT': {
      const idx = action.index;
      if (idx == null || idx < 0 || idx >= state.parkingLot.length) return state;
      const text = state.parkingLot[idx];
      const parentId = state.activeParentId;
      if (!parentId) return state;
      const parent = getNode(state, parentId);
      if (!parent) return state;
      const ring = parent.ring + 1;
      if (ring > 3) return state;
      const siblings = getChildren(state, parentId);
      if (siblings.length >= maxChildrenForRing(ring)) return state;
      const newNode = {
        id: __newNodeId(),
        text,
        ring,
        parentId,
      };
      const newState = { ...state, nodes: [...state.nodes, newNode] };
      return wheelReducer({
        ...newState,
        parkingLot: newState.parkingLot.filter((_, i) => i !== idx),
      }, { type: '__POST_PROMOTE_DISRUPTOR_CHECK', newNode });
    }

    case '__POST_PROMOTE_DISRUPTOR_CHECK': {
      const newNode = action.newNode;
      const ring2ExistsBefore = state.nodes.filter((n) => n.id !== newNode.id).some((n) => n.ring === 2);
      const ring3ExistsBefore = state.nodes.filter((n) => n.id !== newNode.id).some((n) => n.ring === 3);
      const isFirstRing2 =
        newNode.ring === 2 &&
        !ring2ExistsBefore &&
        !state.disruptorHistory.find((h) => h.context === '1to2');
      const isFirstRing3 =
        newNode.ring === 3 &&
        !ring3ExistsBefore &&
        !state.disruptorHistory.find((h) => h.context === '2to3');
      let pendingDisruptor = state.pendingDisruptor;
      if (isFirstRing2) {
        const type = nextDisruptorType(state.disruptorHistory, '1to2');
        if (type) {
          pendingDisruptor = {
            nodeId: newNode.id,
            questionType: type,
            question: pickDisruptorQuestion(type, state.disruptorHistory),
            context: '1to2',
          };
        }
      } else if (isFirstRing3) {
        const type = nextDisruptorType(state.disruptorHistory, '2to3');
        if (type) {
          pendingDisruptor = {
            nodeId: newNode.id,
            questionType: type,
            question: pickDisruptorQuestion(type, state.disruptorHistory),
            context: '2to3',
          };
        }
      }
      return { ...state, pendingDisruptor };
    }

    case 'FINISH':
      return { ...state, phase: 'result', pendingDisruptor: null };

    case 'BACK_TO_BUILD':
      return { ...state, phase: 'build' };

    case 'RESTART':
      return { ...initialWheelState };

    default:
      return state;
  }
}


/* ===== src/state/layout.js ===== */
const LAYOUT = {
  radii: [0, 300, 560, 800],
  nodeR: [95, 82, 70, 60],
  ring1Wedge: 0.82,
  ring2Wedge: 0.7,
};

function computeLayout(state) {
  const positions = new Map();
  const center = getCenter(state);
  if (!center) return positions;

  positions.set(center.id, {
    x: 0,
    y: 0,
    angle: -Math.PI / 2,
    parentAngle: -Math.PI / 2,
    ring: 0,
  });

  const ring1 = getChildren(state, center.id);
  ring1.forEach((node, i) => {
    const slot = ring1.length === 0 ? 0 : (2 * Math.PI) / ring1.length;
    const baseAngle = -Math.PI / 2 + i * slot + slot / 2;
    const x = LAYOUT.radii[1] * Math.cos(baseAngle);
    const y = LAYOUT.radii[1] * Math.sin(baseAngle);
    positions.set(node.id, {
      x,
      y,
      angle: baseAngle,
      parentAngle: -Math.PI / 2,
      ring: 1,
    });

    const ring2 = getChildren(state, node.id);
    const wedge2 = slot * LAYOUT.ring1Wedge;
    ring2.forEach((c2, j) => {
      const offset = ring2.length === 1
        ? 0
        : (j / (ring2.length - 1) - 0.5) * wedge2;
      const a2 = baseAngle + offset;
      const x2 = LAYOUT.radii[2] * Math.cos(a2);
      const y2 = LAYOUT.radii[2] * Math.sin(a2);
      positions.set(c2.id, {
        x: x2,
        y: y2,
        angle: a2,
        parentAngle: baseAngle,
        ring: 2,
      });

      const ring3 = getChildren(state, c2.id);
      const wedge3 = (wedge2 / Math.max(ring2.length, 1)) * LAYOUT.ring2Wedge;
      ring3.forEach((c3, k) => {
        const offset3 = ring3.length === 1
          ? 0
          : (k / (ring3.length - 1) - 0.5) * wedge3;
        const a3 = a2 + offset3;
        const x3 = LAYOUT.radii[3] * Math.cos(a3);
        const y3 = LAYOUT.radii[3] * Math.sin(a3);
        positions.set(c3.id, {
          x: x3,
          y: y3,
          angle: a3,
          parentAngle: a2,
          ring: 3,
        });
      });
    });
  });

  return positions;
}

function curvedPath(from, to) {
  const dx = to.x - from.x;
  const dy = to.y - from.y;
  const mx = (from.x + to.x) / 2;
  const my = (from.y + to.y) / 2;
  const len = Math.hypot(dx, dy);
  if (len === 0) return 'M ' + from.x + ' ' + from.y + ' L ' + to.x + ' ' + to.y;
  const px = -dy / len;
  const py = dx / len;
  const curve = Math.min(len * 0.18, 28);
  const cx = mx + px * curve;
  const cy = my + py * curve;
  return 'M ' + from.x + ' ' + from.y + ' Q ' + cx + ' ' + cy + ' ' + to.x + ' ' + to.y;
}

function computeBoundingBox(positions, nodeR) {
  if (positions.size === 0) {
    return { minX: -400, minY: -400, maxX: 400, maxY: 400 };
  }
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  positions.forEach((pos) => {
    const r = nodeR[pos.ring] || 50;
    minX = Math.min(minX, pos.x - r);
    minY = Math.min(minY, pos.y - r);
    maxX = Math.max(maxX, pos.x + r);
    maxY = Math.max(maxY, pos.y + r);
  });
  return { minX, minY, maxX, maxY };
}


/* ===== src/components/wheel.js ===== */
function useZoomPan(svgRef) {
  const { React } = window;
  const { useState, useEffect, useRef, useCallback } = React;
  const [view, setView] = useState({ cx: 0, cy: 0, zoom: 1, vw: 1000, vh: 800 });
  const dragRef = useRef(null);
  const pinchRef = useRef(null);
  const animRef = useRef(null);

  useEffect(() => {
    const el = svgRef.current;
    if (!el) return;
    const ro = new ResizeObserver(() => {
      const r = el.getBoundingClientRect();
      setView((v) => ({ ...v, vw: r.width || 1000, vh: r.height || 800 }));
    });
    ro.observe(el);
    return () => ro.disconnect();
  }, [svgRef]);

  const computeTarget = useCallback((bbox, padding = 80) => {
    const el = svgRef.current;
    if (!el) return null;
    const r = el.getBoundingClientRect();
    const vw = r.width || 1000;
    const vh = r.height || 800;
    const bw = (bbox.maxX - bbox.minX) + padding * 2;
    const bh = (bbox.maxY - bbox.minY) + padding * 2;
    const cx = (bbox.minX + bbox.maxX) / 2;
    const cy = (bbox.minY + bbox.maxY) / 2;
    const zoomX = vw / bw;
    const zoomY = vh / bh;
    const zoom = Math.max(0.2, Math.min(zoomX, zoomY, 2));
    return { cx, cy, zoom, vw, vh };
  }, [svgRef]);

  const fitTo = useCallback((bbox, padding = 80, animated = true) => {
    if (animRef.current) {
      cancelAnimationFrame(animRef.current);
      animRef.current = null;
    }
    const target = computeTarget(bbox, padding);
    if (!target) return;

    if (!animated) {
      setView(target);
      return;
    }

    const duration = 520;
    let start = null;
    let startView = null;
    setView((v) => {
      startView = v;
      return v;
    });
    const tick = (now) => {
      if (start === null) start = now;
      const t = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - t, 3);
      setView({
        cx: startView.cx + (target.cx - startView.cx) * eased,
        cy: startView.cy + (target.cy - startView.cy) * eased,
        zoom: startView.zoom + (target.zoom - startView.zoom) * eased,
        vw: target.vw,
        vh: target.vh,
      });
      if (t < 1) {
        animRef.current = requestAnimationFrame(tick);
      } else {
        animRef.current = null;
      }
    };
    animRef.current = requestAnimationFrame(tick);
  }, [computeTarget]);

  const zoomBy = useCallback((factor, anchor) => {
    if (animRef.current) {
      cancelAnimationFrame(animRef.current);
      animRef.current = null;
    }
    setView((v) => {
      const newZoom = Math.max(0.2, Math.min(4, v.zoom * factor));
      if (!anchor) {
        return { ...v, zoom: newZoom };
      }
      const ax = v.cx + (anchor.x - v.vw / 2) / v.zoom;
      const ay = v.cy + (anchor.y - v.vh / 2) / v.zoom;
      const newCx = ax - (anchor.x - v.vw / 2) / newZoom;
      const newCy = ay - (anchor.y - v.vh / 2) / newZoom;
      return { ...v, zoom: newZoom, cx: newCx, cy: newCy };
    });
  }, []);

  const onMouseDown = (e) => {
    if (e.button !== 0) return;
    if (animRef.current) { cancelAnimationFrame(animRef.current); animRef.current = null; }
    dragRef.current = { x: e.clientX, y: e.clientY, startCx: 0, startCy: 0 };
    setView((v) => {
      dragRef.current.startCx = v.cx;
      dragRef.current.startCy = v.cy;
      return v;
    });
    e.currentTarget.classList.add('dragging');
  };

  const onMouseMove = (e) => {
    if (!dragRef.current) return;
    const dx = e.clientX - dragRef.current.x;
    const dy = e.clientY - dragRef.current.y;
    setView((v) => ({
      ...v,
      cx: dragRef.current.startCx - dx / v.zoom,
      cy: dragRef.current.startCy - dy / v.zoom,
    }));
  };

  const onMouseUp = (e) => {
    dragRef.current = null;
    if (e.currentTarget) e.currentTarget.classList.remove('dragging');
  };

  const onWheel = (e) => {
    e.preventDefault();
    const rect = e.currentTarget.getBoundingClientRect();
    const anchor = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    const factor = e.deltaY < 0 ? 1.12 : 0.89;
    zoomBy(factor, anchor);
  };

  const onTouchStart = (e) => {
    if (animRef.current) { cancelAnimationFrame(animRef.current); animRef.current = null; }
    if (e.touches.length === 1) {
      const t = e.touches[0];
      dragRef.current = { x: t.clientX, y: t.clientY, startCx: 0, startCy: 0 };
      setView((v) => {
        dragRef.current.startCx = v.cx;
        dragRef.current.startCy = v.cy;
        return v;
      });
    } else if (e.touches.length === 2) {
      const t1 = e.touches[0], t2 = e.touches[1];
      const dx = t2.clientX - t1.clientX;
      const dy = t2.clientY - t1.clientY;
      const dist = Math.hypot(dx, dy);
      pinchRef.current = { dist, zoom: view.zoom };
      dragRef.current = null;
    }
  };

  const onTouchMove = (e) => {
    if (e.touches.length === 1 && dragRef.current) {
      e.preventDefault();
      const t = e.touches[0];
      const dx = t.clientX - dragRef.current.x;
      const dy = t.clientY - dragRef.current.y;
      setView((v) => ({
        ...v,
        cx: dragRef.current.startCx - dx / v.zoom,
        cy: dragRef.current.startCy - dy / v.zoom,
      }));
    } else if (e.touches.length === 2 && pinchRef.current) {
      e.preventDefault();
      const t1 = e.touches[0], t2 = e.touches[1];
      const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      const factor = dist / pinchRef.current.dist;
      setView((v) => ({
        ...v,
        zoom: Math.max(0.2, Math.min(4, pinchRef.current.zoom * factor)),
      }));
    }
  };

  const onTouchEnd = (e) => {
    if (e.touches.length === 0) {
      dragRef.current = null;
      pinchRef.current = null;
    }
  };

  const viewBox = (() => {
    const w = view.vw / view.zoom;
    const h = view.vh / view.zoom;
    const x = view.cx - w / 2;
    const y = view.cy - h / 2;
    return x + ' ' + y + ' ' + w + ' ' + h;
  })();

  return {
    viewBox,
    view,
    handlers: {
      onMouseDown,
      onMouseMove,
      onMouseUp,
      onMouseLeave: onMouseUp,
      onWheel,
      onTouchStart,
      onTouchMove,
      onTouchEnd,
    },
    fitTo,
    zoomBy,
  };
}

function WheelNode(props) {
  const { React, htm } = window;
  const { useRef, useEffect } = React;
  const html = htm.bind(React.createElement);
  const { node, pos, isActive, isCenter, hasNote, isFresh, isPulsing, onClick, onDelete, onEdit, nodeR } = props;
  const r = nodeR[node.ring];

  const len = (node.text || '').length;
  const baseFont = node.ring === 0 ? 17 : node.ring === 1 ? 15 : node.ring === 2 ? 14 : 13;
  let fontSize = baseFont;
  if (len > 140) fontSize = baseFont - 4;
  else if (len > 100) fontSize = baseFont - 3;
  else if (len > 60) fontSize = baseFont - 2;
  else if (len > 30) fontSize = baseFont - 1;
  fontSize = Math.max(10, fontSize);

  const fillColor = node.ring === 0
    ? 'var(--c-ring-0)'
    : node.ring === 1
      ? 'var(--c-ring-1-soft)'
      : node.ring === 2
        ? 'var(--c-ring-2-soft)'
        : 'var(--c-ring-3-soft)';
  const strokeColor = node.ring === 0
    ? 'var(--c-ring-0)'
    : node.ring === 1
      ? 'var(--c-ring-1)'
      : node.ring === 2
        ? 'var(--c-ring-2)'
        : 'var(--c-ring-3)';

  const onActivate = (e) => {
    e.stopPropagation();
    if (onClick) onClick(node);
  };

  const onDeleteClick = (e) => {
    e.stopPropagation();
    if (onDelete) onDelete(node);
  };
  const onEditClick = (e) => {
    e.stopPropagation();
    if (onEdit) onEdit(node);
  };

  const foW = r * 1.9;
  const foH = r * 1.75;
  const fo = html`
    <foreignObject
      x=${-foW / 2}
      y=${-foH / 2}
      width=${foW}
      height=${foH}
      style=${{ pointerEvents: 'none', overflow: 'visible' }}
    >
      <div xmlns="http://www.w3.org/1999/xhtml"
        style=${{
          width: '100%',
          height: '100%',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
          textAlign: 'center',
          fontSize: fontSize + 'px',
          lineHeight: 1.22,
          color: isCenter ? '#fff' : 'var(--c-ink)',
          fontFamily: isCenter ? 'var(--font-serif)' : 'var(--font-sans)',
          fontWeight: 400,
          wordBreak: 'break-word',
          hyphens: 'auto',
          padding: '6px',
          userSelect: 'none',
          boxSizing: 'border-box',
        }}
      >${node.text}</div>
    </foreignObject>`;

  const classNames = ['node-group'];
  if (isFresh) classNames.push('entering');
  if (isActive) classNames.push('active');
  if (isPulsing) classNames.push('pulsing');

  const groupStyle = {
    transform: 'translate(' + pos.x + 'px, ' + pos.y + 'px)',
  };

  // Action buttons positioned around the bubble
  const actionR = r * 0.92;
  const actionAngleDel = -Math.PI * 0.35;
  const actionAngleEdit = -Math.PI * 0.18;
  const delX = Math.cos(actionAngleDel) * actionR;
  const delY = Math.sin(actionAngleDel) * actionR;
  const editX = Math.cos(actionAngleEdit) * actionR;
  const editY = Math.sin(actionAngleEdit) * actionR;

  return html`
    <g
      class=${classNames.join(' ')}
      style=${groupStyle}
      onClick=${onActivate}
      onMouseDown=${(e) => e.stopPropagation()}
      onTouchStart=${(e) => e.stopPropagation()}
    >
      <circle
        class="node-circle"
        r=${r}
        fill=${fillColor}
        stroke=${strokeColor}
        stroke-width="2"
      />
      ${fo}
      ${hasNote && html`
        <circle class="disruptor-marker" cx=${r * 0.72} cy=${-r * 0.72} r="7" />
      `}
      ${onEdit && html`
        <g class="node-action edit-btn" transform=${'translate(' + editX + ',' + editY + ')'} onClick=${onEditClick}>
          <circle class="node-action-bg" r="14" />
          <text class="node-action-icon" x="0" y="1" text-anchor="middle" dominant-baseline="central">✎</text>
        </g>
      `}
      ${!isCenter && onDelete && html`
        <g class="node-action delete-btn" transform=${'translate(' + delX + ',' + delY + ')'} onClick=${onDeleteClick}>
          <circle class="node-action-bg" r="14" />
          <text class="node-action-icon" x="0" y="1" text-anchor="middle" dominant-baseline="central">×</text>
        </g>
      `}
      <title>${node.text}${hasNote ? ' (mit Notiz)' : ''}</title>
    </g>`;
}

function ConnectionLine({ from, to, ring, isFresh }) {
  const { React, htm } = window;
  const { useRef, useEffect } = React;
  const html = htm.bind(React.createElement);
  const pathRef = useRef(null);
  const d = curvedPath(from, to);
  const color = ring === 1
    ? 'var(--c-ring-1)'
    : ring === 2
      ? 'var(--c-ring-2)'
      : 'var(--c-ring-3)';

  useEffect(() => {
    if (pathRef.current) {
      try {
        const length = pathRef.current.getTotalLength();
        pathRef.current.style.setProperty('--len', length);
      } catch (e) {
        pathRef.current.style.setProperty('--len', 600);
      }
    }
  }, [d]);

  return html`
    <path
      ref=${pathRef}
      class=${'connection-line' + (isFresh ? ' entering' : '')}
      d=${d}
      stroke=${color}
      stroke-width=${ring === 1 ? 2.2 : ring === 2 ? 1.8 : 1.4}
      opacity=${0.6}
    />`;
}

function EditOverlay({ node, onSave, onCancel }) {
  const { React, htm } = window;
  const { useState, useRef, useEffect } = React;
  const html = htm.bind(React.createElement);
  const [text, setText] = useState(node ? node.text : '');
  const ref = useRef(null);

  useEffect(() => {
    setText(node ? node.text : '');
    const t = setTimeout(() => {
      if (ref.current) {
        ref.current.focus();
        ref.current.select();
      }
    }, 80);
    return () => clearTimeout(t);
  }, [node ? node.id : null]);

  if (!node) return null;

  const onKey = (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey || !e.shiftKey)) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        onSave(text);
      }
    }
    if (e.key === 'Escape') {
      e.preventDefault();
      onCancel();
    }
  };

  return html`
    <div class="edit-overlay" role="dialog" aria-modal="true" onClick=${onCancel}>
      <div class="edit-card" onClick=${(e) => e.stopPropagation()}>
        <div class="edit-label">Folge bearbeiten</div>
        <textarea
          ref=${ref}
          class="edit-textarea"
          value=${text}
          onChange=${(e) => setText(e.target.value)}
          onKeyDown=${onKey}
          rows="3"
        ></textarea>
        <div class="edit-actions">
          <button class="btn-ghost" onClick=${onCancel}>Abbrechen</button>
          <button
            class="btn-primary"
            onClick=${() => onSave(text)}
            disabled=${!text.trim() || text.trim() === node.text}
          >Speichern</button>
        </div>
      </div>
    </div>`;
}

function WheelView({ state, dispatch, onWheelRefReady }) {
  const { React, htm } = window;
  const { useRef, useEffect, useMemo, useState } = React;
  const html = htm.bind(React.createElement);

  const svgRef = useRef(null);
  const positions = useMemo(() => computeLayout(state), [state.nodes]);
  const bbox = useMemo(
    () => computeBoundingBox(positions, LAYOUT.nodeR),
    [positions],
  );

  const { viewBox, view, handlers, fitTo, zoomBy } = useZoomPan(svgRef);

  // Track freshly-added node IDs for entrance animation + parent-pulsing.
  // Each newly-added node gets its own timer so rapid successive adds
  // don't strand earlier ids in the "entering" set.
  const [freshIds, setFreshIds] = useState(new Set());
  const [pulsingId, setPulsingId] = useState(null);
  const prevIdsRef = useRef(new Set());
  const timersRef = useRef([]);
  useEffect(() => () => {
    timersRef.current.forEach((t) => clearTimeout(t));
    timersRef.current = [];
  }, []);
  useEffect(() => {
    const currentIds = new Set(state.nodes.map((n) => n.id));
    const newIds = [];
    currentIds.forEach((id) => {
      if (!prevIdsRef.current.has(id)) newIds.push(id);
    });
    prevIdsRef.current = currentIds;
    if (newIds.length === 0) return;
    setFreshIds((prev) => {
      const next = new Set(prev);
      newIds.forEach((id) => next.add(id));
      return next;
    });
    // Pulse the parent of the (most recent) new node
    const newestId = newIds[newIds.length - 1];
    const newest = state.nodes.find((n) => n.id === newestId);
    if (newest && newest.parentId) {
      setPulsingId(newest.parentId);
      const pt = setTimeout(() => setPulsingId((cur) => (cur === newest.parentId ? null : cur)), 320);
      timersRef.current.push(pt);
    }
    // Per-batch timer that removes only THIS batch's ids
    const batch = newIds.slice();
    const t = setTimeout(() => {
      setFreshIds((prev) => {
        const next = new Set(prev);
        batch.forEach((id) => next.delete(id));
        return next;
      });
    }, 760);
    timersRef.current.push(t);
  }, [state.nodes]);

  const firstFitRef = useRef(false);
  useEffect(() => {
    if (onWheelRefReady) onWheelRefReady({ svgRef, fitTo: (b, p) => fitTo(b, p, true), zoomBy, bbox });
  }, [onWheelRefReady, fitTo, zoomBy, bbox]);

  useEffect(() => {
    const t = setTimeout(() => {
      fitTo(bbox, 80, firstFitRef.current);
      firstFitRef.current = true;
    }, 60);
    return () => clearTimeout(t);
  }, [state.nodes.length, view.vw, view.vh]);

  const [editingNode, setEditingNode] = useState(null);

  const center = getCenter(state);
  const lines = [];
  state.nodes.forEach((node) => {
    if (!node.parentId) return;
    const from = positions.get(node.parentId);
    const to = positions.get(node.id);
    if (from && to) {
      lines.push(html`<${ConnectionLine}
        key=${'l_' + node.id}
        from=${from}
        to=${to}
        ring=${node.ring}
        isFresh=${freshIds.has(node.id)}
      />`);
    }
  });

  const onDeleteNode = (n) => {
    if (state.isExample) return;
    const descendants = state.nodes.filter((nn) => nn.parentId === n.id).length;
    let total = descendants;
    // Count all descendants (cascade)
    const toCount = [n.id];
    const counted = new Set();
    while (toCount.length > 0) {
      const id = toCount.pop();
      state.nodes.forEach((nn) => {
        if (nn.parentId === id && !counted.has(nn.id)) {
          counted.add(nn.id);
          toCount.push(nn.id);
        }
      });
    }
    total = counted.size;
    if (total > 0) {
      const word = total === 1 ? 'vertiefte Folge' : 'vertiefte Folgen';
      if (!confirm('„' + n.text + '" loeschen?\n\nDamit verschwinden auch ' + total + ' ' + word + ' darunter.')) {
        return;
      }
    } else {
      if (!confirm('„' + n.text + '" loeschen?')) return;
    }
    dispatch({ type: 'DELETE_NODE', id: n.id });
  };

  const onEditNode = (n) => {
    if (state.isExample) return;
    setEditingNode(n);
  };

  const onSaveEdit = (newText) => {
    if (editingNode && newText.trim()) {
      dispatch({ type: 'EDIT_NODE', id: editingNode.id, text: newText.trim() });
    }
    setEditingNode(null);
  };

  const nodeEls = state.nodes.map((node) => {
    const pos = positions.get(node.id);
    if (!pos) return null;
    return html`<${WheelNode}
      key=${node.id}
      node=${node}
      pos=${pos}
      isActive=${state.activeParentId === node.id}
      isCenter=${node.ring === 0}
      hasNote=${!!node.disruptorNote}
      isFresh=${freshIds.has(node.id)}
      isPulsing=${pulsingId === node.id}
      onClick=${(n) => dispatch({ type: 'SELECT_PARENT', id: n.id })}
      onDelete=${state.isExample ? null : onDeleteNode}
      onEdit=${state.isExample ? null : onEditNode}
      nodeR=${LAYOUT.nodeR}
    />`;
  });

  const onBgClick = () => {
    if (center) dispatch({ type: 'BACK_TO_CENTER' });
  };

  // Deepen-affordance hint
  const ring1Count = state.nodes.filter((n) => n.ring === 1).length;
  const ring2PlusCount = state.nodes.filter((n) => n.ring >= 2).length;
  const isAtCenter = center && state.activeParentId === center.id;
  const showDeepenHint =
    !state.isExample &&
    state.phase === 'build' &&
    ring1Count >= 2 &&
    ring2PlusCount === 0 &&
    isAtCenter;

  return html`
    <div class="wheel-stage">
      <svg
        ref=${svgRef}
        viewBox=${viewBox}
        preserveAspectRatio="xMidYMid meet"
        onMouseDown=${handlers.onMouseDown}
        onMouseMove=${handlers.onMouseMove}
        onMouseUp=${handlers.onMouseUp}
        onMouseLeave=${handlers.onMouseLeave}
        onWheel=${handlers.onWheel}
        onTouchStart=${handlers.onTouchStart}
        onTouchMove=${handlers.onTouchMove}
        onTouchEnd=${handlers.onTouchEnd}
        onClick=${onBgClick}
      >
        <g>${lines}</g>
        <g>${nodeEls}</g>
      </svg>
      <div class="wheel-controls">
        <button
          class="wheel-ctrl-btn"
          onClick=${() => zoomBy(1.2)}
          title=${PROMPTS.wheel.zoomIn}
          aria-label=${PROMPTS.wheel.zoomIn}
        >+</button>
        <button
          class="wheel-ctrl-btn"
          onClick=${() => zoomBy(0.83)}
          title=${PROMPTS.wheel.zoomOut}
          aria-label=${PROMPTS.wheel.zoomOut}
        >−</button>
        <button
          class="wheel-ctrl-btn"
          onClick=${() => fitTo(bbox, 80, true)}
          title=${PROMPTS.wheel.fitAll}
          aria-label=${PROMPTS.wheel.fitAll}
          style=${{ fontSize: '13px' }}
        >⤢</button>
      </div>
      ${showDeepenHint && html`
        <div class="deepen-hint">
          <span class="deepen-hint-arrow">↑</span>
          <span>Klicke eine Folge, um sie zu vertiefen</span>
        </div>
      `}
      <${EditOverlay}
        node=${editingNode}
        onSave=${onSaveEdit}
        onCancel=${() => setEditingNode(null)}
      />
      <${DisruptorCard} state=${state} dispatch=${dispatch} />
    </div>`;
}

function FlowPanel({ state, dispatch }) {
  const { React, htm } = window;
  const { useState, useEffect } = React;
  const html = htm.bind(React.createElement);
  const [text, setText] = useState('');
  const [activeDirection, setActiveDirection] = useState(null);

  const parent = state.activeParentId
    ? getNode(state, state.activeParentId)
    : getCenter(state);
  const activeRing = getActiveRing(state);
  const siblings = parent ? getChildren(state, parent.id) : [];
  const maxChildren = activeRing === 1 ? 4 : 3;
  const canAdd = siblings.length < maxChildren && activeRing <= 3;
  const reachedDepthLimit = parent && parent.ring >= 3;

  useEffect(() => {
    setText('');
    setActiveDirection(null);
  }, [state.activeParentId]);

  const submit = () => {
    if (!text.trim() || !canAdd) return;
    dispatch({ type: 'ADD_NODE', text, parentId: parent ? parent.id : null });
    setText('');
    setActiveDirection(null);
  };

  const onKeyDown = (e) => {
    if (e.key === 'Enter') submit();
  };

  const toggleDirection = (key) => {
    setActiveDirection((cur) => (cur === key ? null : key));
  };

  const finishEnabled = canFinish(state);
  const finishProminent = shouldHighlightFinish(state);

  const question = activeRing === 1
    ? PROMPTS.build.ring1Question
    : PROMPTS.build.ringNQuestion;
  const hint = activeRing === 1
    ? PROMPTS.build.ring1Hint
    : PROMPTS.build.ringNHint;

  const ringMarkerColor = activeRing === 1
    ? 'var(--c-ring-1)'
    : activeRing === 2
      ? 'var(--c-ring-2)'
      : 'var(--c-ring-3)';

  const activeDirObj = activeDirection
    ? PROMPTS.thinkingDirections.find((d) => d.key === activeDirection)
    : null;

  return html`
    <aside class="flow-panel">
      <div class="flow-header">
        <div class="flow-context">
          ${activeRing <= 3
            ? PROMPTS.result.ringLabel(activeRing)
            : PROMPTS.build.depthLimit}
        </div>
        ${parent && parent.ring > 0 && html`
          <div class="flow-deepening">
            ${PROMPTS.build.deepening}: <em>„${parent.text}"</em>
          </div>
        `}
        ${!reachedDepthLimit && html`<h2 class="flow-question">${question}</h2>`}
        ${!reachedDepthLimit && html`<div class="flow-hint">${hint}</div>`}
        ${reachedDepthLimit && html`
          <div class="flow-hint" style=${{ fontStyle: 'italic' }}>
            ${PROMPTS.build.depthLimit}
          </div>
        `}
        ${!reachedDepthLimit && html`
          <div class="flow-input-row">
            <input
              class="flow-input"
              type="text"
              value=${text}
              placeholder=${PROMPTS.build.inputPlaceholder}
              onChange=${(e) => setText(e.target.value)}
              onKeyDown=${onKeyDown}
              disabled=${!canAdd}
            />
            <button
              class="flow-add-btn"
              onClick=${submit}
              disabled=${!canAdd || !text.trim()}
            >${PROMPTS.build.addButton}</button>
          </div>
        `}
      </div>

      <div class="flow-body">
        ${!reachedDepthLimit && canAdd && html`
          <div class="thinking-block">
            <div class="thinking-label">${PROMPTS.build.thinkingLabel}</div>
            <div class="thinking-chips">
              ${PROMPTS.thinkingDirections.map((d) => html`
                <button
                  key=${d.key}
                  class=${'thinking-chip' + (activeDirection === d.key ? ' active' : '')}
                  onClick=${() => toggleDirection(d.key)}
                  type="button"
                >${d.label}</button>
              `)}
            </div>
            ${activeDirObj && html`
              <div class="thinking-question">
                ${activeDirObj.question}
              </div>
            `}
          </div>
        `}

        ${siblings.length > 0 && html`
          <div class="flow-existing-list">
            ${siblings.map((n) => html`
              <div key=${n.id} class="flow-existing-item">
                <span class="marker" style=${{ background: ringMarkerColor }}></span>
                <span>${n.text}</span>
              </div>
            `)}
          </div>
        `}

        ${siblings.length >= maxChildren && html`
          <div class="flow-meta-hint">
            ${activeRing === 1 ? PROMPTS.validation.ring1Max : PROMPTS.validation.ringNMax}
          </div>
        `}

        ${parent && parent.ring === 0 && state.nodes.length > 1 && html`
          <div class="flow-meta-hint">${PROMPTS.build.asymmetricHint}</div>
        `}

        ${parent && parent.ring > 0 && html`
          <button
            class="btn-ghost"
            onClick=${() => dispatch({ type: 'BACK_TO_CENTER' })}
            style=${{ alignSelf: 'flex-start' }}
          >← ${PROMPTS.build.backToCenter}</button>
        `}

        ${parent && parent.ring === 0 && state.nodes.length > 1 && html`
          <div class="flow-meta-hint">${PROMPTS.build.selectToDeepen}</div>
        `}
      </div>

      <${ParkingLot} state=${state} dispatch=${dispatch} canPromote=${canAdd} />

      ${finishEnabled && html`
        <div class="flow-footer">
          <button
            class=${'finish-cta ' + (finishProminent ? 'prominent' : 'subtle')}
            onClick=${() => dispatch({ type: 'FINISH' })}
          >${PROMPTS.build.finishButton}</button>
          ${!finishProminent && html`
            <div class="flow-meta-hint" style=${{ textAlign: 'center' }}>${PROMPTS.build.finishHint}</div>
          `}
        </div>
      `}
    </aside>`;
}
